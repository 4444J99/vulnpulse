name: Retrieve verified dependency lockfile

on:
  push:
    branches:
      - repair/vulnpulse-lockfile-20261016

permissions:
  contents: read
  actions: read

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieve-verified-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the successful verification source
        uses: actions/checkout@v4
        with:
          ref: 31aa5b0e8f1c79cf0f8c0959bbf5f1e9e97f035a
          persist-credentials: false

      - name: Download the successful run's candidate lockfile
        uses: actions/download-artifact@v4
        with:
          name: candidate-lockfile
          run-id: 38975839500
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/vulnpulse-lock-receipt

      - name: Verify source and checksums, then print the public lockfile receipt
        env:
          LOCK_RECEIPT: ${{ runner.temp }}/vulnpulse-lock-receipt
        run: |
          test "$(cat "$LOCK_RECEIPT/repair-source-sha.txt")" = 31aa5b0e8f1c79cf0f8c0959bbf5f1e9e97f035a
          cp package.json "$LOCK_RECEIPT/package.json"
          cd "$LOCK_RECEIPT"
          sha256sum --check --strict repair-checksums.txt
          echo 'BEGIN_VULNPULSE_PACKAGE_LOCK_SHA256'
          sha256sum package-lock.json
          echo 'END_VULNPULSE_PACKAGE_LOCK_SHA256'
          echo 'BEGIN_VULNPULSE_PACKAGE_LOCK_GZIP_BASE64'
          gzip -n -c package-lock.json | base64 --wrap=76
          echo 'END_VULNPULSE_PACKAGE_LOCK_GZIP_BASE64'
